<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rumo">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Rumo — Organização Financeira</title>
<style>
:root{--bg:#F7F7F8;--surface:#fff;--ink:#1D1D1F;--soft:#6E6E73;--line:rgba(0,0,0,.07);--field:rgba(0,0,0,.045);--tint:rgba(0,0,0,.035);--inc:#1F9E6D;--exp:#D0453A;--goal:#6B5CE0;--warn:#B8790A;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 20px rgba(0,0,0,.04)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
input,select,button{font:inherit;color:inherit}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 22px calc(32px + env(safe-area-inset-bottom));animation:in .4s cubic-bezier(.22,1,.36,1)}
.brand{text-align:center;margin-bottom:32px}
.mark{width:56px;height:56px;border-radius:16px;background:var(--ink);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.brand h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.brand p{color:var(--soft);font-size:15px;margin-top:6px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:24px;width:100%;max-width:420px;margin:0 auto}
.card.wide{max-width:none;margin:0}
.seg{display:flex;gap:2px;background:var(--tint);border-radius:12px;padding:3px;margin-bottom:18px}
.seg button{flex:1;padding:8px 0;border:0;background:transparent;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--soft);cursor:pointer;transition:background .18s,color .18s}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--soft);margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;border:0;border-radius:12px;background:var(--field);font-size:16px;min-height:46px}
.field input[type=date]{display:block;-webkit-appearance:none;appearance:none;text-align:left}
.field input::-webkit-date-and-time-value{text-align:left}
.field input:focus,.field select:focus{outline:0;box-shadow:0 0 0 2px var(--ink)}
.frow{display:flex;gap:10px}.frow .field{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip input{display:none}
.chip span{display:block;padding:9px 13px;border-radius:20px;background:var(--field);font-size:13.5px;font-weight:600;color:var(--soft);cursor:pointer;transition:.15s}
.chip input:checked+span{background:var(--ink);color:#fff}
.btn-primary{width:100%;padding:15px;border:0;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;margin-top:6px;transition:transform .12s,opacity .12s}
.btn-primary:active{transform:scale(.98);opacity:.85}
.btn-danger{width:100%;padding:13px;border:0;background:transparent;color:var(--exp);font-weight:600;cursor:pointer;margin-top:4px}
.btn-text{display:block;width:100%;padding:12px 2px;border:0;background:transparent;font-size:14px;font-weight:600;text-align:left;cursor:pointer}
.btn-text:active,.pill:active,.back:active{opacity:.5}
.err{background:rgba(208,69,58,.1);color:var(--exp);font-size:13px;font-weight:500;padding:12px 14px;border-radius:12px;margin-bottom:14px}
.note{background:var(--tint);color:var(--soft);font-size:13px;padding:14px;border-radius:12px;line-height:1.5;margin:12px 0}
.warn{background:rgba(184,121,10,.1);color:var(--warn);font-size:13px;font-weight:600;padding:14px 16px;border-radius:14px;margin-bottom:14px}
.wn{color:var(--warn)}
.preview{background:var(--tint);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;color:var(--soft);margin-bottom:14px}
.preview b{color:var(--ink)}
.shell{min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(16px + env(safe-area-inset-top)) 22px 12px;display:flex;justify-content:space-between;align-items:center}
.greet{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sub{color:var(--soft);font-size:13px;margin-top:2px}
.top button{border:0;background:transparent;color:var(--soft);font-size:14px;font-weight:500;padding:6px 0 6px 12px;cursor:pointer}
main{flex:1;padding:6px 22px 120px;max-width:560px;width:100%;margin:0 auto;animation:in .3s cubic-bezier(.22,1,.36,1)}
.sthead{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px}
.st{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:8px 0 14px}
.sthead .st{margin:0}
.sh{font-size:17px;font-weight:700;margin:26px 0 10px;letter-spacing:-.01em}
.pill{border:0;background:var(--tint);border-radius:20px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill.dark{background:var(--ink);color:#fff}
.back{border:0;background:transparent;padding:6px 0;margin-bottom:2px;font-size:15px;font-weight:600;color:var(--soft);cursor:pointer}
.hero{padding:4px 0 18px}
.hero .l{color:var(--soft);font-size:15px;font-weight:500}
.hero .v{font-size:46px;font-weight:700;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.duo{display:flex;gap:12px;margin-bottom:12px}
.mini{flex:1;min-width:0;background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.mini .l{color:var(--soft);font-size:13px;font-weight:500;margin-bottom:6px}
.mini .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.mini .s{color:var(--soft);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group{background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 18px;transition:background .15s}
.row[data-edit],.row[data-tab]{cursor:pointer}
.row[data-edit]:active,.row[data-tab]:active{background:var(--tint)}
.row+.row,.group>details+details{border-top:1px solid var(--line)}
.rmain{flex:1;min-width:0}
.rt{font-weight:600;font-size:15px}
.rs{color:var(--soft);font-size:13px;margin-top:2px;line-height:1.45}
.ramt{font-weight:700;font-size:15px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.chev{color:var(--soft);font-size:20px}
.total .rt,.total .ramt{font-weight:800}
.pside{text-align:right}
.pacts{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.pacts .pill{padding:6px 12px;font-size:12.5px}
.empty{background:var(--tint);border-radius:18px;padding:26px 20px;text-align:center;color:var(--soft);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .pill{margin-top:14px;background:var(--surface)}
.wk summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 18px;cursor:pointer}
.wk summary::-webkit-details-marker{display:none}
.wkb{padding:0 18px 14px}
.dayh{font-size:12.5px;font-weight:700;color:var(--soft);margin:10px 0 4px}
.ev{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:3px 0}
.ev span:last-child{white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--tint);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .3s}
.gcard{background:var(--surface);border-radius:18px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer}
.gcard .top2{display:flex;justify-content:space-between;gap:12px}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(247,247,248,.88);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 2px calc(8px + env(safe-area-inset-bottom));display:flex}
nav.bot button{flex:1;background:none;border:0;color:var(--soft);font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;transition:color .15s}
nav.bot button.active{color:var(--ink);font-weight:600}
.ic{width:23px;height:23px;transition:transform .18s}
nav.bot button.active .ic{transform:translateY(-1px) scale(1.06)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:26px;margin:0 auto 18px}
</style>
</head>
<body>
<div id="app"></div>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js').catch(()=>{}))}

<script>
(()=>{
'use strict';
const LS_U='rumo_users',LS_S='rumo_session';
const CATS=['Moradia','Alimentação','Saúde','Transporte','Lazer','Financeiro','Outros'];
const ACC_T=['Dinheiro','Conta corrente','Poupança','Carteira digital','Investimentos'];
const DOW=['dom','seg','ter','qua','qui','sex','sáb'],DOWF=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const FREQ=[['diario','Diário'],['semanal','Semanal'],['quinzenal','A cada 15 dias'],['mensal','Mensal']];
const $=(s,r=document)=>r.querySelector(s);
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(v,cur)=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:cur||'BRL'});

//#engine-start
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fdate=s=>{const d=pd(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const fdow=s=>DOW[pd(s).getDay()];
const rel=s=>{const t=today();return s===t?'Hoje':s===addD(t,1)?'Amanhã':`${fdow(s)} ${fdate(s)}`};

const isOcc=(r,s)=>{
  if(!r.ancora||s<r.ancora)return false;
  const f=r.frequencia;
  if(f==='diario'){const dias=r.dias&&r.dias.length?r.dias:[0,1,2,3,4,5,6];return dias.includes(pd(s).getDay())}
  const diff=diffD(r.ancora,s);
  if(f==='semanal')return diff%7===0;
  if(f==='quinzenal')return diff%15===0;
  const d=pd(s),a=pd(r.ancora),last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return d.getDate()===Math.min(a.getDate(),last);
};
const occ=(r,from,to)=>{const o=[];for(let s=from;s<=to;s=addD(s,1))if(isOcc(r,s))o.push(s);return o};
const liquido=c=>Math.max(0,(+c.valorBase||0)*(1+(+c.adicionalPercentual||0)/100)-(+c.descontoValor||0));
const calcText=(c,cur)=>{
  const b=+c.valorBase||0,p=+c.adicionalPercentual||0,d=+c.descontoValor||0;
  let t=money(b,cur);
  if(p)t+=` + ${p}% (${money(b*p/100,cur)})`;
  if(d)t+=` − ${money(d,cur)}`;
  return (p||d)?`${t} = ${money(liquido(c),cur)}`:t;
};
const cadence=r=>{
  if(r.frequencia==='diario'){
    const d=(r.dias&&r.dias.length?r.dias:[0,1,2,3,4,5,6]).slice().sort((a,b)=>((a+6)%7)-((b+6)%7));
    return d.length===7?'todos os dias':d.map(x=>DOW[x]).join(', ');
  }
  if(r.frequencia==='semanal'){const w=pd(r.ancora).getDay();return (w===0||w===6?'todo ':'toda ')+DOWF[w]}
  if(r.frequencia==='quinzenal')return 'a cada 15 dias';
  return `todo dia ${pd(r.ancora).getDate()}`;
};
const accSaldo=(u,id)=>{
  const t=today(),a=(u.accounts||[]).find(x=>x.id===id);
  let s=a?(+a.saldoInicial||0):0;
  (u.transactions||[]).forEach(x=>{
    const v=+x.valor||0;
    if(x.tipo==='entrada'){if(x.contaId===id&&x.data<=t)s+=v}
    else if(x.tipo==='despesa'){if(x.contaId===id&&x.status==='pago')s-=v}
    else if(x.tipo==='transferencia'&&x.data<=t){if(x.contaOrigemId===id)s-=v;if(x.contaDestinoId===id)s+=v}
  });
  return s;
};
const total=u=>(u.accounts||[]).reduce((s,a)=>s+accSaldo(u,a.id),0);
function rules(u){
  const r=[];
  (u.companies||[]).forEach(c=>{if(c.status!=='inativo')r.push({key:c.id,src:'companies',kind:'renda',tipo:'entrada',nome:c.empresa+(c.cargo?' · '+c.cargo:''),valor:liquido(c),frequencia:c.frequencia,dias:c.dias,ancora:c.ancora,inicio:c.inicio||'0000',confirmados:c.confirmados||[],contaId:c.contaId,cat:'Renda'})});
  (u.recurrences||[]).forEach(c=>{if(c.ativo!==false)r.push({key:c.id,src:'recurrences',kind:'conta',tipo:'despesa',nome:c.descricao,valor:+c.valor||0,frequencia:c.frequencia,dias:c.dias,ancora:c.ancora,inicio:c.inicio||'0000',confirmados:c.confirmados||[],contaId:c.contaId,cat:c.categoria||'Outros'})});
  return r;
}
function events(u,days){
  const t=today(),end=addD(t,days),back=addD(t,-45),ev=[];
  rules(u).forEach(r=>{
    const from=r.inicio>back?r.inicio:back;
    occ(r,from,end).forEach(s=>{
      if(r.confirmados.includes(s))return;
      ev.push({data:s<t?t:s,orig:s,late:s<t,tipo:r.tipo,nome:r.nome,valor:r.valor,key:r.key,src:r.src});
    });
  });
  (u.transactions||[]).forEach(x=>{
    const v=+x.valor||0;
    if(x.tipo==='despesa'&&x.status==='pendente'){
      const d=x.data<t?t:x.data;
      if(d<=end)ev.push({data:d,orig:x.data,late:x.data<t,tipo:'despesa',nome:x.descricao||'Despesa',valor:v,key:x.id,src:'tx'});
    }else if(x.tipo==='entrada'&&x.data>t&&x.data<=end){
      ev.push({data:x.data,orig:x.data,late:false,tipo:'entrada',nome:x.descricao||'Entrada',valor:v,key:x.id,src:'tx'});
    }
  });
  ev.sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.tipo===b.tipo?0:a.tipo==='entrada'?-1:1));
  return ev;
}
function fc(u,days){
  const ev=events(u,days),s0=total(u);
  let run=s0,min=s0,minDate=today(),neg=s0<0?today():null,ent=0,sai=0;
  const src={};
  ev.forEach(e=>{
    if(e.tipo==='entrada'){run+=e.valor;ent+=e.valor}else{run-=e.valor;sai+=e.valor}
    if(run<min){min=run;minDate=e.data}
    if(run<0&&!neg)neg=e.data;
    const k=e.src+e.key;
    const o=src[k]=src[k]||{nome:e.nome,tipo:e.tipo,valor:e.valor,n:0,total:0,datas:[],src:e.src,key:e.key};
    o.n++;o.total+=e.valor;o.datas.push(e.data);
  });
  return{ev,s0,fim:run,ent,sai,min,minDate,neg,src:Object.values(src)};
}
function weeks(f,days){
  const t=today(),end=addD(t,days),W=[],by={};
  let run=f.s0;
  f.ev.forEach(e=>(by[e.data]=by[e.data]||[]).push(e));
  for(let s=t;s<=end;s=addD(s,1)){
    const mon=addD(s,-((pd(s).getDay()+6)%7));
    let w=W[W.length-1];
    if(!w||w.mon!==mon){w={mon,ini:s,fim:s,ent:0,sai:0,dias:[],saldo:run};W.push(w)}
    w.fim=s;
    const es=by[s]||[];
    es.forEach(e=>{if(e.tipo==='entrada'){w.ent+=e.valor;run+=e.valor}else{w.sai+=e.valor;run-=e.valor}});
    if(es.length)w.dias.push({s,es});
    w.saldo=run;
  }
  return W;
}
//#engine-end

const users=()=>lsGet(LS_U,[]);
function save(u){const a=users(),i=a.findIndex(x=>x.id===u.id);i>-1?a[i]=u:a.push(u);return lsSet(LS_U,a)}
function migrate(u){
  if(u.schema>=2)return u;
  u.companies=u.companies||[];
  const keep=[];
  (u.recurrences||[]).forEach(r=>{
    if(r.origemEmpresaId)return;
    if(r.tipo==='entrada'){u.companies.push({id:'emp_'+uid(),empresa:r.descricao,cargo:'',tipoVinculo:'Outro',valorBase:r.valor,adicionalPercentual:0,descontoValor:0,frequencia:r.frequencia,ancora:r.ancora,contaId:r.contaId,status:'ativo'});return}
    keep.push(r);
  });
  u.recurrences=keep;
  const t=today();
  [...u.companies,...u.recurrences].forEach(x=>{x.inicio=x.inicio||t;x.confirmados=x.confirmados||[];delete x.recurrenceId});
  u.goals=u.goals||[];u.orcamento=u.orcamento||{};u.categories=u.categories||[];u.transactions=u.transactions||[];u.accounts=u.accounts||[];
  u.schema=2;save(u);return u;
}
function getUser(){
  const s=lsGet(LS_S,null),u=s&&users().find(x=>x.id===s.userId);
  return u?migrate(u):null;
}

const S={authMode:'login',err:'',forgot:false,tab:'dashboard',form:null,txf:'all',hor:30};
const root=$('#app');
const TABS=[
['dashboard','Início','<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h5v-5h2v5h5v-9"/>'],
['lancamentos','Lançamentos','<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M8.5 9h7M8.5 13h7M8.5 17h4"/>'],
['previsao','Previsão','<path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/>'],
['orcamento','Orçamento','<circle cx="12" cy="12" r="7.5"/><path d="M12 12V4.5A7.5 7.5 0 0 1 19.5 12H12Z"/>'],
['metas','Metas','<circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3.8"/><circle cx="12" cy="12" r=".6" fill="currentColor" stroke="none"/>'],
['mais','Mais','<circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/>']];

/* ---------- helpers de UI ---------- */
const row=(t,s,r,a='')=>`<div class="row" ${a}><div class="rmain"><div class="rt">${t}</div>${s?`<div class="rs">${s}</div>`:''}</div>${r!=null?`<div class="ramt">${r}</div>`:''}</div>`;
const group=h=>`<div class="group">${h}</div>`;
const empty=(t,s,b)=>`<div class="empty"><b>${t}</b>${s}${b||''}</div>`;
const head=(t,kind)=>`<div class="sthead"><h2 class="st">${t}</h2>${kind?`<button class="pill dark" data-new="${kind}">+ Novo</button>`:''}</div>`;
const back=(t='Mais')=>`<button class="back" data-tab="mais">‹ ${t}</button>`;
const sign=(tipo,v,c)=>`<span class="${tipo==='entrada'?'inc':'exp'}">${tipo==='entrada'?'+':'−'}${money(v,c)}</span>`;
const fld=(l,i)=>`<div class="field"><label>${l}</label>${i}</div>`;
const inp=(n,t,v,x='')=>`<input name="${n}" type="${t}" value="${esc(v??'')}" ${x}>`;
const sel=(n,o,v)=>`<select name="${n}">${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return `<option value="${esc(a)}"${String(a)===String(v)?' selected':''}>${esc(b)}</option>`}).join('')}</select>`;
const accOpts=u=>(u.accounts||[]).map(a=>[a.id,a.nome]);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);requestAnimationFrame(()=>t.classList.add('on'));setTimeout(()=>{t.classList.remove('on');setTimeout(()=>t.remove(),300)},1900)}
const phone=v=>{const d=(v||'').replace(/\D/g,'').slice(0,11);if(!d)return '';if(d.length<=2)return '('+d;if(d.length<=6)return `(${d.slice(0,2)}) ${d.slice(2)}`;if(d.length<=10)return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`};

/* ---------- auth ---------- */
function auth(){
  const L=S.authMode==='login';
  const form=L?(S.forgot?`<div class="note">Se este e-mail estiver cadastrado, enviaríamos um link de recuperação. Como os dados ficam só neste aparelho, não há envio de e-mail — se esquecer a senha, será preciso criar uma nova conta.</div><button class="btn-text" data-action="back-login">‹ Voltar ao login</button>`:
  `<form id="form-login">${fld('E-mail',inp('email','email','','required autocomplete="email"'))}${fld('Senha',inp('senha','password','','required autocomplete="current-password"'))}<button class="btn-primary" type="submit">Entrar</button><button class="btn-text" type="button" data-action="forgot">Esqueci minha senha</button></form>`):
  `<form id="form-cad">${fld('Nome completo',inp('nomeCompleto','text','','required'))}${fld('Nome de preferência',inp('nomePreferencia','text','','placeholder="Como quer ser chamado(a)"'))}${fld('E-mail',inp('email','email','','required'))}<div class="frow">${fld('Senha',inp('senha','password','','required autocomplete="new-password"'))}${fld('Confirmar',inp('confirmar','password','','required autocomplete="new-password"'))}</div>${fld('Data de nascimento (opcional)',inp('dataNascimento','date',''))}${fld('Telefone (opcional)',inp('telefone','tel','','inputmode="tel" placeholder="(11) 91234-5678" maxlength="15"'))}<button class="btn-primary" type="submit">Criar conta</button></form>`;
  return `<div class="auth"><div class="brand"><div class="mark"><svg viewBox="0 0 24 24" width="26" height="26"><polygon points="12,3 18,12 6,12" fill="#fff"/><polygon points="6,12 18,12 12,21" fill="#fff" opacity=".4"/></svg></div><h1>Rumo</h1><p>Sua organização financeira em um só lugar</p></div><div class="card"><div class="seg"><button data-authmode="login" class="${L?'active':''}">Entrar</button><button data-authmode="cad" class="${!L?'active':''}">Criar conta</button></div>${S.err?`<div class="err">${esc(S.err)}</div>`:''}${form}</div></div>`;
}
const salt=()=>Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b=>pad(b.toString(16))).join('');
const sha=async s=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))).map(b=>b.toString(16).padStart(2,'0')).join('');
async function login(f){
  const fd=new FormData(f),em=String(fd.get('email')).trim().toLowerCase(),pw=String(fd.get('senha'));
  const u=users().find(x=>x.email.toLowerCase()===em);
  if(!u||!u.salt||await sha(u.salt+':'+pw)!==u.senhaHash){S.err='E-mail ou senha incorretos.';return render()}
  S.err='';S.tab='dashboard';S.form=null;lsSet(LS_S,{userId:u.id});render();
}
async function signup(f){
  const fd=new FormData(f),g=n=>String(fd.get(n)??'').trim(),em=g('email').toLowerCase(),pw=String(fd.get('senha'));
  const bad=!g('nomeCompleto')?'Informe seu nome completo.':!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)?'Informe um e-mail válido.':pw.length<6?'A senha deve ter pelo menos 6 caracteres.':pw!==String(fd.get('confirmar'))?'As senhas não coincidem.':users().some(x=>x.email.toLowerCase()===em)?'Já existe uma conta com este e-mail.':'';
  if(bad){S.err=bad;return render()}
  const s=salt(),u={id:'u_'+uid(),nomeCompleto:g('nomeCompleto'),nomePreferencia:g('nomePreferencia'),email:em,salt:s,senhaHash:await sha(s+':'+pw),dataNascimento:g('dataNascimento'),telefone:g('telefone'),moeda:'BRL',primeiroDiaMes:1,criadoEm:new Date().toISOString(),accounts:[{id:'acc_'+uid(),nome:'Carteira',tipo:'Dinheiro',instituicao:'',saldoInicial:0}],transactions:[],categories:[],recurrences:[],companies:[],goals:[],orcamento:{},schema:2};
  save(u);S.err='';S.tab='dashboard';lsSet(LS_S,{userId:u.id});render();
}

/* ---------- shell ---------- */
function app(u){
  const nm=u.nomePreferencia||u.nomeCompleto.split(' ')[0];
  const act=['contas','categorias','rendas','fixas'].includes(S.tab)?'mais':S.tab;
  const V={dashboard:vHome,lancamentos:vTx,previsao:vPrev,orcamento:vOrc,metas:vMeta,mais:vMais,contas:vAcc,categorias:vCat,rendas:vRend,fixas:vFixa};
  return `<div class="shell"><header class="top"><div><div class="greet">Olá, ${esc(nm)}</div><div class="sub">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div></div><button data-action="logout">Sair</button></header><main>${S.form?vForm(u):V[S.tab](u)}</main><nav class="bot">${TABS.map(([id,l,p])=>`<button data-tab="${id}" class="${act===id?'active':''}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${p}</svg><span>${l}</span></button>`).join('')}</nav></div>`;
}
function render(){const u=getUser();root.innerHTML=u?app(u):auth();const f=$('#f');if(f)formSync(f)}

/* ---------- Início ---------- */
function vHome(u){
  const c=u.moeda,t=today(),f7=fc(u,7),f30=fc(u,30),pend=events(u,0);
  const gasto=(u.transactions||[]).filter(x=>x.tipo==='despesa'&&x.status==='pago'&&(x.data||'').startsWith(t.slice(0,7))).reduce((s,x)=>s+(+x.valor||0),0);
  const guardar=(u.goals||[]).filter(g=>g.ativo!==false&&(+g.valorAtual||0)<(+g.valorObjetivo||0)).reduce((s,g)=>s+(+g.contribuicaoMensal||0),0);
  const nE=f30.ev.find(e=>e.tipo==='entrada'),nD=f30.ev.find(e=>e.tipo==='despesa');
  const mini=(l,e,cls)=>`<div class="mini"><div class="l">${l}</div>${e?`<div class="v ${cls}">${money(e.valor,c)}</div><div class="s">${rel(e.data)} · ${esc(e.nome)}</div>`:'<div class="s">Nada previsto</div>'}</div>`;
  const livre=f30.min-guardar;
  const acts=e=>`<div class="pacts"><button class="pill dark" data-action="confirm" data-src="${e.src}" data-key="${e.key}" data-orig="${e.orig}">${e.tipo==='entrada'?'Recebi':'Paguei'}</button>${e.src!=='tx'?`<button class="pill" data-action="skip" data-src="${e.src}" data-key="${e.key}" data-orig="${e.orig}">Pular</button>`:''}</div>`;
  const pendH=pend.length?`<h3 class="sh">Para confirmar</h3>${group(pend.map(e=>`<div class="row"><div class="rmain"><div class="rt">${esc(e.nome)}</div><div class="rs">${e.late?'Atrasado · '+fdate(e.orig):'Hoje'} · ${e.tipo==='entrada'?'receber':'pagar'}</div></div><div class="pside"><div class="ramt ${e.tipo==='entrada'?'inc':'exp'}">${money(e.valor,c)}</div>${acts(e)}</div></div>`).join(''))}${pend.length>1?'<button class="btn-text" data-action="confirm-all">Confirmar todos</button>':''}`:'';
  const prox=f30.ev.filter(e=>e.tipo==='despesa'&&e.data>t).slice(0,4);
  return `<div class="hero"><div class="l">Saldo atual</div><div class="v">${money(f30.s0,c)}</div></div>`+
  (f30.neg?`<div class="warn">Atenção: seu saldo previsto fica negativo em ${fdate(f30.neg)}.</div>`:'')+
  pendH+
  `<div class="duo" style="margin-top:${pend.length?'14px':'0'}">${mini('Próxima entrada',nE,'inc')}${mini('Próxima despesa',nD,'exp')}</div>`+
  group(
    row('Previsto em 7 dias',null,money(f7.fim,c),'data-tab="previsao" data-hor="7"')+
    row('Previsto em 30 dias','toque para ver o cálculo',money(f30.fim,c),'data-tab="previsao" data-hor="30"')+
    row('Gasto neste mês',null,`<span class="exp">${money(gasto,c)}</span>`)+
    row('Disponível para gastar',`menor saldo previsto em 30 dias (${fdate(f30.minDate)}), já reservando as metas`,`<span class="${livre<0?'exp':''}">${money(livre,c)}</span>`)+
    row('Preciso guardar este mês',null,`<span style="color:var(--goal)">${money(guardar,c)}</span>`)
  )+
  (prox.length?`<h3 class="sh">Próximas contas</h3>${group(prox.map(e=>row(esc(e.nome),rel(e.data),money(e.valor,c))).join(''))}`:'')+
  (!rules(u).length?empty('Comece cadastrando suas rendas','O app calcula datas e previsões sozinho a partir delas.',`<br><button class="pill" data-tab="rendas">Cadastrar renda</button>`):'');
}

/* ---------- Previsão ---------- */
function vPrev(u){
  const c=u.moeda,h=S.hor,f=fc(u,h),W=weeks(f,h),end=addD(today(),h),R=rules(u);
  const seg=[7,15,30,60].map(d=>`<button data-hor="${d}" class="${h===d?'active':''}">${d} dias</button>`).join('');
  if(!R.length&&!f.ev.length)return `${head('Quanto vou ter')}<div class="seg">${seg}</div>${empty('Nada para prever ainda','Cadastre suas rendas e contas fixas e o app projeta seu saldo dia a dia.','<br><button class="pill" data-tab="rendas">Cadastrar renda</button> <button class="pill" data-tab="fixas">Cadastrar conta fixa</button>')}`;
  const src=f.src.slice().sort((a,b)=>a.tipo===b.tipo?0:a.tipo==='entrada'?-1:1).map(s=>{
    const co=s.src==='companies'?(u.companies||[]).find(x=>x.id===s.key):null,r=R.find(x=>x.key===s.key);
    const ds=s.n<=6?` (${s.datas.map(fdate).join(', ')})`:'';
    return row(esc(s.nome),`${co?calcText(co,c):money(s.valor,c)}<br>${s.n}× · ${r?cadence(r):'lançamento'}${ds}`,sign(s.tipo,s.total,c));
  }).join('');
  const wk=W.map(w=>`<details class="wk"><summary><div class="rmain"><div class="rt">${w.ini===today()?'Hoje':fdate(w.ini)} – ${fdate(w.fim)}</div><div class="rs">+${money(w.ent,c)} · −${money(w.sai,c)}</div></div><div class="ramt ${w.saldo<0?'exp':''}">${money(w.saldo,c)}</div></summary><div class="wkb">${w.dias.length?w.dias.map(d=>`<div class="dayh">${fdow(d.s)} ${fdate(d.s)}</div>${d.es.map(e=>`<div class="ev"><span>${esc(e.nome)}</span>${sign(e.tipo,e.valor,c)}</div>`).join('')}`).join(''):'<div class="rs">Nada previsto</div>'}</div></details>`).join('');
  return `${head('Quanto vou ter')}<div class="seg">${seg}</div>`+
  `<div class="hero"><div class="l">Saldo previsto em ${fdate(end)}</div><div class="v ${f.fim<0?'exp':''}">${money(f.fim,c)}</div></div>`+
  (f.neg?`<div class="warn">Seu saldo previsto fica negativo em ${fdate(f.neg)}.</div>`:'')+
  group(row('Saldo hoje',null,money(f.s0,c))+row('+ Entradas previstas',null,`<span class="inc">${money(f.ent,c)}</span>`)+row('− Saídas previstas',null,`<span class="exp">${money(f.sai,c)}</span>`)+`<div class="total">${row('= Saldo em '+h+' dias',`menor saldo no período: ${money(f.min,c)} (${fdate(f.minDate)})`,money(f.fim,c))}</div>`)+
  `<h3 class="sh">De onde vem esse número</h3>${src?group(src):empty('Nenhum evento no período','')}`+
  `<h3 class="sh">Semana a semana</h3><div class="rs" style="margin:-4px 0 10px">Saldo ao fim de cada semana. Toque para ver os dias.</div>${group(wk)}`+
  `<div class="rs" style="margin-top:6px">Cálculo feito pelas datas reais do calendário (meses com 5 domingos, dias 31 etc.), sem médias.</div>`;
}

/* ---------- Lançamentos ---------- */
function vTx(u){
  const c=u.moeda,A=id=>((u.accounts||[]).find(a=>a.id===id)||{}).nome||'—';
  let l=[...(u.transactions||[])].sort((a,b)=>b.data.localeCompare(a.data)||(b.criadoEm||'').localeCompare(a.criadoEm||''));
  if(S.txf!=='all')l=l.filter(x=>x.tipo===S.txf);
  const seg=[['all','Todos'],['entrada','Entradas'],['despesa','Despesas'],['transferencia','Transf.']].map(([v,t])=>`<button data-txf="${v}" class="${S.txf===v?'active':''}">${t}</button>`).join('');
  const rows=l.slice(0,200).map(x=>{
    const tr=x.tipo==='transferencia',pend=x.tipo==='despesa'&&x.status==='pendente';
    const sub=tr?`${esc(A(x.contaOrigemId))} → ${esc(A(x.contaDestinoId))}`:`${esc(x.categoria||'Outros')} · ${esc(A(x.contaId))}`;
    return row(esc(x.descricao||'Sem descrição'),`${sub} · ${fdate(x.data)}${pend?' · <span class="wn">pendente</span>':''}`,tr?money(x.valor,c):sign(x.tipo,x.valor,c),`data-edit="tx:${x.id}"`);
  }).join('');
  return `${head('Lançamentos','tx')}<div class="seg">${seg}</div>${l.length?group(rows):empty('Nenhum lançamento','Toque em “+ Novo” para registrar uma entrada ou despesa.')}`;
}

/* ---------- Orçamento ---------- */
function vOrc(u){
  const c=u.moeda,ym=today().slice(0,7),g={},L=u.orcamento||{};
  (u.transactions||[]).forEach(x=>{if(x.tipo==='despesa'&&x.status==='pago'&&(x.data||'').startsWith(ym))g[x.categoria||'Outros']=(g[x.categoria||'Outros']||0)+(+x.valor||0)});
  const cats=[...CATS,...(u.categories||[])].filter(k=>+L[k]>0||g[k]);
  const cards=cats.map(k=>{
    const lim=+L[k]||0,gs=g[k]||0,p=lim?Math.round(gs/lim*100):0;
    const col=!lim?'var(--soft)':p>=100?'var(--exp)':p>=80?'var(--warn)':'var(--inc)';
    const st=!lim?'Sem limite':p>=100?'Acima do limite':p>=80?'Atenção':'Dentro do orçamento';
    return `<div class="gcard" data-new="orc"><div class="top2"><div class="rt">${esc(k)}</div><div class="rs" style="color:${col};font-weight:600;margin:0">${st}</div></div><div class="rs">${money(gs,c)}${lim?` de ${money(lim,c)} · resta ${money(Math.max(0,lim-gs),c)}`:''}</div>${lim?`<div class="bar"><i style="width:${Math.min(100,p)}%;background:${col}"></i></div>`:''}</div>`;
  }).join('');
  return `<div class="sthead"><h2 class="st">Orçamento do mês</h2><button class="pill dark" data-new="orc">Limites</button></div>${cards||empty('Sem limites definidos','Defina quanto quer gastar por categoria e acompanhe aqui.')}`;
}

/* ---------- Metas ---------- */
function vMeta(u){
  const c=u.moeda,G=(u.goals||[]).filter(g=>g.ativo!==false);
  const cards=G.map(g=>{
    const o=+g.valorObjetivo||0,a=+g.valorAtual||0,ct=+g.contribuicaoMensal||0,fa=Math.max(0,o-a),p=o?Math.min(100,Math.round(a/o*100)):0;
    return `<div class="gcard" data-edit="meta:${g.id}"><div class="top2"><div class="rt">${esc(g.nome)}</div><div class="ramt">${p}%</div></div><div class="rs">${money(a,c)} de ${money(o,c)}</div><div class="bar"><i style="width:${p}%;background:var(--goal)"></i></div><div class="rs" style="margin-top:8px">${fa?`Faltam ${money(fa,c)}`:'Meta concluída'}${ct&&fa?` · guardando ${money(ct,c)}/mês · ~${Math.ceil(fa/ct)} meses`:''}</div></div>`;
  }).join('');
  return `${head('Metas','meta')}${cards||empty('Nenhuma meta ainda','Crie uma meta e defina quanto guardar por mês.')}`;
}

/* ---------- Mais ---------- */
function vMais(u){
  return `<h2 class="st">Mais</h2>`+
  `<h3 class="sh" style="margin-top:8px">Planejamento</h3>`+group(
    row('Fontes de renda',`${(u.companies||[]).length} cadastrada(s)`,'<span class="chev">›</span>','data-tab="rendas"')+
    row('Contas fixas',`${(u.recurrences||[]).length} cadastrada(s)`,'<span class="chev">›</span>','data-tab="fixas"'))+
  `<h3 class="sh">Cadastros</h3>`+group(
    row('Contas e carteiras',`${(u.accounts||[]).length} conta(s)`,'<span class="chev">›</span>','data-tab="contas"')+
    row('Categorias',`${(u.categories||[]).length} personalizada(s)`,'<span class="chev">›</span>','data-tab="categorias"')+
    row('Meu perfil','Dados pessoais, moeda e mês financeiro','<span class="chev">›</span>','data-edit="perfil:me"'))+
  `<h3 class="sh">Seus dados</h3><div class="note">Seus dados ficam salvos neste aparelho, no navegador. Se limpar os dados do Safari ou trocar de aparelho, eles se perdem — faça backup de vez em quando.</div>`+
  `<button class="btn-text" data-action="export">Baixar backup</button><label class="btn-text" style="cursor:pointer">Restaurar backup<input type="file" id="imp" accept="application/json,.json" style="display:none"></label>`;
}

/* ---------- Contas / Categorias ---------- */
function vAcc(u){
  const c=u.moeda,A=u.accounts||[];
  return `${back()}${head('Contas e carteiras','acc')}`+(A.length?group(A.map(a=>row(esc(a.nome),`${esc(a.tipo)}${a.instituicao?' · '+esc(a.instituicao):''}`,money(accSaldo(u,a.id),c),`data-edit="acc:${a.id}"`)).join(''))+`<div class="rs">Saldo total: <b>${money(total(u),c)}</b></div>`:empty('Nenhuma conta','Cadastre onde está seu dinheiro.'));
}
function vCat(u){
  const C=u.categories||[];
  return `${back()}${head('Categorias','cat')}`+group(CATS.map(k=>row(esc(k),'Padrão',null)).join('')+C.map(k=>row(esc(k),'Personalizada','<span class="chev">›</span>',`data-edit="cat:${esc(k)}"`)).join(''));

/* ---------- Rendas / Contas fixas ---------- */
const monthRange=()=>{const t=today(),d=pd(t);return[t.slice(0,8)+'01',iso(new Date(d.getFullYear(),d.getMonth()+1,0))]};
function vRend(u){
  const c=u.moeda,t=today(),R=rules(u).filter(r=>r.tipo==='entrada'),[ms,me]=monthRange();
  const mes=R.reduce((s,r)=>s+occ(r,ms,me).length*r.valor,0),n30=R.reduce((s,r)=>s+occ(r,t,addD(t,30)).length*r.valor,0);
  const rows=(u.companies||[]).map(co=>{
    const r=R.find(x=>x.key===co.id),ds=r?occ(r,t,addD(t,30)):[];
    return row(esc(co.empresa)+(co.status==='inativo'?' <span class="rs">(inativo)</span>':''),`${esc(co.cargo||'')}${co.cargo?' · ':''}${cadence({...co,frequencia:co.frequencia})}<br>${calcText(co,c)}${r?`<br>Próximos 30 dias: ${ds.length}× = <b>${money(ds.length*r.valor,c)}</b>`:''}`,money(liquido(co),c),`data-edit="rend:${co.id}"`);
  }).join('');
  return `${back()}${head('Fontes de renda','rend')}`+
  group(row('Este mês (datas reais)',null,`<span class="inc">${money(mes,c)}</span>`)+row('Próximos 30 dias',null,`<span class="inc">${money(n30,c)}</span>`))+
  ((u.companies||[]).length?group(rows):empty('Nenhuma fonte de renda','Cadastre salário, freelas, diárias… O app calcula as datas e valores.'));
}
function vFixa(u){
  const c=u.moeda,t=today(),R=rules(u).filter(r=>r.tipo==='despesa'),[ms,me]=monthRange();
  const mes=R.reduce((s,r)=>s+occ(r,ms,me).length*r.valor,0),n30=R.reduce((s,r)=>s+occ(r,t,addD(t,30)).length*r.valor,0);
  const rows=(u.recurrences||[]).map(r=>{
    const rr=R.find(x=>x.key===r.id),n=rr?occ(rr,t,addD(t,90))[0]:null;
    return row(esc(r.descricao)+(r.ativo===false?' <span class="rs">(inativa)</span>':''),`${esc(r.categoria||'Outros')} · ${cadence(r)}${n?` · próximo ${rel(n)}`:''}`,money(r.valor,c),`data-edit="fixa:${r.id}"`);
  }).join('');
  return `${back()}${head('Contas fixas','fixa')}`+
  group(row('Este mês (datas reais)',null,`<span class="exp">${money(mes,c)}</span>`)+row('Próximos 30 dias',null,`<span class="exp">${money(n30,c)}</span>`))+
  ((u.recurrences||[]).length?group(rows):empty('Nenhuma conta fixa','Cadastre aluguel, internet, mensalidades… e os vencimentos entram sozinhos na previsão.'));
}

/* ---------- formulários ---------- */
function schedFields(o){
  const dias=o.dias&&o.dias.length?o.dias:[1,2,3,4,5,6];
  return fld('Frequência',sel('frequencia',FREQ,o.frequencia||'mensal'))+
  `<div class="field" data-g="dias"><label>Dias da semana</label><div class="chips">${[1,2,3,4,5,6,0].map(d=>`<label class="chip"><input type="checkbox" name="dia" value="${d}"${dias.includes(d)?' checked':''}><span>${DOW[d]}</span></label>`).join('')}</div></div>`+
  fld(o.lbl,inp('ancora','date',o.ancora||today(),'required'));
}
const readSched=f=>{const fd=new FormData(f);return{frequencia:fd.get('frequencia'),dias:fd.getAll('dia').map(Number),ancora:fd.get('ancora')}};
function shell(title,body,{edit,dup}={}){
  return `<button class="back" data-action="cancel">‹ Voltar</button><h2 class="st">${title}</h2><form id="f" class="card wide">${body}<button class="btn-primary" type="submit">Salvar</button>${edit&&dup?'<button class="btn-text" type="button" data-action="dup" style="text-align:center">Duplicar</button>':''}${edit?'<button class="btn-danger" type="button" data-action="delete">Excluir</button>':''}</form>`;
}
const LISTS={tx:'transactions',acc:'accounts',rend:'companies',fixa:'recurrences',meta:'goals'};
function vForm(u){
  const{kind,id}=S.form,it=id&&LISTS[kind]?(u[LISTS[kind]]||[]).find(x=>x.id===id):null,e=!!it,acc=accOpts(u),c=u.moeda;
  if(kind==='tx'){
    const x=it||{tipo:'despesa',data:today(),status:'pago'},cats=[...CATS,...(u.categories||[])];
    if(x.categoria&&!cats.includes(x.categoria))cats.push(x.categoria);
    return shell(e?'Editar lançamento':'Novo lançamento',
      fld('Tipo',sel('tipo',[['entrada','Entrada'],['despesa','Despesa'],['transferencia','Transferência']],x.tipo))+
      fld('Descrição',inp('descricao','text',x.descricao,'required'))+
      `<div class="frow">${fld('Valor',inp('valor','number',x.valor,'step="0.01" min="0.01" inputmode="decimal" required'))}${fld('Data',inp('data','date',x.data,'required'))}</div>`+
      fld('Conta',sel('contaId',acc,x.contaId||x.contaOrigemId))+
      `<div data-g="dest">${fld('Conta de destino',sel('contaDestinoId',acc,x.contaDestinoId))}</div>`+
      `<div data-g="cat">${fld('Categoria',sel('categoria',cats,x.categoria))}</div>`+
      `<div data-g="status">${fld('Status',sel('status',[['pago','Pago'],['pendente','Pendente (ainda vou pagar)']],x.status||'pago'))}</div>`,{edit:e,dup:true});
  }
  if(kind==='acc'){
    return shell(e?'Editar conta':'Nova conta',
      fld('Nome',inp('nome','text',it&&it.nome,'required placeholder="Ex: Nubank"'))+fld('Tipo',sel('tipo',ACC_T,it&&it.tipo))+fld('Instituição (opcional)',inp('instituicao','text',it&&it.instituicao))+
      (e?fld('Saldo atual',inp('saldoAtual','number',accSaldo(u,it.id).toFixed(2),'step="0.01" inputmode="decimal"'))+'<div class="note">Alterar o saldo atual ajusta o saldo inicial da conta.</div>':fld('Saldo inicial',inp('saldoInicial','number',0,'step="0.01" inputmode="decimal"'))),{edit:e});
  }
  if(kind==='rend'){
    const x=it||{frequencia:'mensal',status:'ativo',ancora:today()};
    return shell(e?'Editar fonte de renda':'Nova fonte de renda',
      fld('Empresa / fonte',inp('empresa','text',x.empresa,'required placeholder="Ex: Braw"'))+fld('Cargo (opcional)',inp('cargo','text',x.cargo))+
      fld('Vínculo',sel('tipoVinculo',['CLT','PJ','Autônomo','Freelance','Outro'],x.tipoVinculo))+
      fld('Valor base por pagamento',inp('valorBase','number',x.valorBase,'step="0.01" min="0" inputmode="decimal" required placeholder="Ex: 900"'))+
      `<div class="frow">${fld('Adicional (%)',inp('adicionalPercentual','number',x.adicionalPercentual||'','step="0.01" inputmode="decimal" placeholder="Ex: 20"'))}${fld('Desconto fixo',inp('descontoValor','number',x.descontoValor||'','step="0.01" inputmode="decimal" placeholder="0"'))}</div>`+
      schedFields({...x,lbl:'Próximo pagamento (ou data de referência)'})+fld('Receber na conta',sel('contaId',acc,x.contaId))+
      (e?fld('Status',sel('status',[['ativo','Ativo'],['inativo','Inativo']],x.status)):'')+'<div class="preview" id="pv"></div>',{edit:e});
  }
  if(kind==='fixa'){
    const x=it||{frequencia:'mensal',ancora:today()},cats=[...CATS,...(u.categories||[])];
    return shell(e?'Editar conta fixa':'Nova conta fixa',
      fld('Descrição',inp('descricao','text',x.descricao,'required placeholder="Ex: Aluguel"'))+fld('Valor',inp('valor','number',x.valor,'step="0.01" min="0.01" inputmode="decimal" required'))+
      schedFields({...x,lbl:'Próximo vencimento'})+fld('Conta usada',sel('contaId',acc,x.contaId))+fld('Categoria',sel('categoria',cats,x.categoria||'Moradia'))+
      (e?fld('Situação',sel('ativo',[['1','Ativa'],['0','Inativa']],x.ativo===false?'0':'1')):'')+'<div class="preview" id="pv"></div>',{edit:e});
  }
  if(kind==='meta'){
    const x=it||{};
    return shell(e?'Editar meta':'Nova meta',
      fld('Nome da meta',inp('nome','text',x.nome,'required placeholder="Ex: Reserva de emergência"'))+fld('Valor objetivo',inp('valorObjetivo','number',x.valorObjetivo,'step="0.01" min="0.01" inputmode="decimal" required'))+
      fld('Valor já guardado',inp('valorAtual','number',x.valorAtual||0,'step="0.01" min="0" inputmode="decimal"'))+fld('Guardar por mês',inp('contribuicaoMensal','number',x.contribuicaoMensal||'','step="0.01" min="0" inputmode="decimal" placeholder="0"'))+'<div class="preview" id="pv"></div>',{edit:e});
  }
  if(kind==='cat')return shell(id?'Editar categoria':'Nova categoria',fld('Nome',inp('nome','text',id||'','required placeholder="Ex: Educação"')),{edit:!!id});
  if(kind==='orc'){
    const L=u.orcamento||{};
    return shell('Limites do mês',[...CATS,...(u.categories||[])].map(k=>fld(esc(k),inp('lim_'+k,'number',L[k]||'','step="0.01" min="0" inputmode="decimal" placeholder="Sem limite"'))).join(''));
  }
  if(kind==='perfil')return shell('Meu perfil',
    `<div class="avatar">${esc((u.nomeCompleto.split(' ').map(p=>p[0]).slice(0,2).join('')||'?').toUpperCase())}</div>`+
    fld('Nome completo',inp('nomeCompleto','text',u.nomeCompleto,'required'))+fld('Nome de preferência',inp('nomePreferencia','text',u.nomePreferencia))+fld('E-mail',inp('email','email',u.email,'required'))+
    fld('Telefone',inp('telefone','tel',phone(u.telefone),'inputmode="tel" placeholder="(11) 91234-5678" maxlength="15"'))+
    `<div class="frow">${fld('Moeda',sel('moeda',[['BRL','Real'],['USD','Dólar'],['EUR','Euro']],u.moeda))}${fld('Mês financeiro começa no dia',sel('primeiroDiaMes',[1,5,10,15,20,25],u.primeiroDiaMes))}</div>`);
  return '';
}
function updatePreview(f,kind,u){
  const pv=$('#pv',f);if(!pv)return;
  const fd=new FormData(f),c=u.moeda,n=k=>+fd.get(k)||0;
  if(kind==='meta'){
    const o=n('valorObjetivo'),a=n('valorAtual'),ct=n('contribuicaoMensal'),fa=Math.max(0,o-a);
    let t=`Faltam <b>${money(fa,c)}</b> · ${o?Math.min(100,Math.round(a/o*100)):0}% guardado`;
    if(ct&&fa){const m=Math.ceil(fa/ct),d=new Date();d.setMonth(d.getMonth()+m);t+=`<br>Guardando ${money(ct,c)}/mês: conclui em ~${m} meses (${d.toLocaleDateString('pt-BR',{month:'short',year:'numeric'})})`}
    pv.innerHTML=t;return;
  }
  const s=readSched(f);let v,h;
  if(kind==='rend'){const co={valorBase:n('valorBase'),adicionalPercentual:n('adicionalPercentual'),descontoValor:n('descontoValor')};v=liquido(co);h=`<b>${calcText(co,c)}</b> por pagamento`}
  else{v=n('valor');h=`<b>${money(v,c)}</b> por vencimento`}
  if(!s.ancora){pv.innerHTML=h;return}
  const t=today(),ds=occ(s,t,addD(t,90)),n30=ds.filter(d=>d<=addD(t,30)).length;
  pv.innerHTML=`${h}<br>${cadence(s)} · próximos: ${ds.slice(0,5).map(fdate).join(', ')||'—'}<br>Próximos 30 dias: ${n30}× ${money(v,c)} = <b>${money(n30*v,c)}</b>`;
}
function formSync(f){
  const k=S.form&&S.form.kind,u=getUser();if(!u)return;
  const fr=f.elements.frequencia,gd=$('[data-g=dias]',f);
  if(fr&&gd)gd.style.display=fr.value==='diario'?'':'none';
  if(k==='tx'){
    const t=f.elements.tipo.value,sh=(n,v)=>{const el=$(`[data-g=${n}]`,f);if(el)el.style.display=v?'':'none'};
    sh('dest',t==='transferencia');sh('cat',t!=='transferencia');sh('status',t==='despesa');
  }
  if(['rend','fixa','meta'].includes(k))updatePreview(f,k,u);
}

function saveForm(u,f){
  const{kind,id}=S.form,fd=new FormData(f),g=k=>String(fd.get(k)??'').trim(),n=k=>+fd.get(k)||0;
  const up=(l,o)=>{const a=u[l]=u[l]||[],i=a.findIndex(x=>x.id===o.id);i>-1?a[i]={...a[i],...o}:a.push(o)};
  if(kind==='tx'){
    const tipo=g('tipo'),o={id:id||'tx_'+uid(),tipo,descricao:g('descricao'),valor:n('valor'),data:g('data')};
    if(tipo==='transferencia'){o.contaOrigemId=g('contaId');o.contaDestinoId=g('contaDestinoId');if(o.contaOrigemId===o.contaDestinoId)return toast('Escolha contas diferentes')}
    else{o.contaId=g('contaId');o.categoria=g('categoria')}
    if(tipo==='despesa')o.status=g('status')||'pago';
    if(id){const old=u.transactions.find(x=>x.id===id);if(old)['contaId','contaOrigemId','contaDestinoId','categoria','status'].forEach(k=>{if(!(k in o))delete old[k]})}else o.criadoEm=new Date().toISOString();
    up('transactions',o);
  }else if(kind==='acc'){
    const o={id:id||'acc_'+uid(),nome:g('nome'),tipo:g('tipo'),instituicao:g('instituicao')};
    if(id){const a=u.accounts.find(x=>x.id===id);o.saldoInicial=n('saldoAtual')-(accSaldo(u,id)-(+a.saldoInicial||0))}else o.saldoInicial=n('saldoInicial');
    up('accounts',o);
  }else if(kind==='rend'){
    up('companies',{id:id||'emp_'+uid(),empresa:g('empresa'),cargo:g('cargo'),tipoVinculo:g('tipoVinculo'),valorBase:n('valorBase'),adicionalPercentual:n('adicionalPercentual'),descontoValor:n('descontoValor'),...readSched(f),contaId:g('contaId'),status:g('status')||'ativo',...(id?{}:{inicio:today(),confirmados:[]})});
  }else if(kind==='fixa'){
    up('recurrences',{id:id||'rec_'+uid(),tipo:'despesa',descricao:g('descricao'),valor:n('valor'),...readSched(f),contaId:g('contaId'),categoria:g('categoria'),ativo:g('ativo')!=='0',...(id?{}:{inicio:today(),confirmados:[]})});
  }else if(kind==='meta'){
    up('goals',{id:id||'goal_'+uid(),nome:g('nome'),valorObjetivo:n('valorObjetivo'),valorAtual:n('valorAtual'),contribuicaoMensal:n('contribuicaoMensal'),ativo:true});
  }else if(kind==='cat'){
    const nm=g('nome');
    if(!nm||[...CATS,...(u.categories||[])].filter(x=>x!==id).some(x=>x.toLowerCase()===nm.toLowerCase()))return toast('Nome inválido ou já existe');
    if(id){u.categories=u.categories.map(x=>x===id?nm:x);(u.transactions||[]).forEach(t=>{if(t.categoria===id)t.categoria=nm});(u.recurrences||[]).forEach(r=>{if(r.categoria===id)r.categoria=nm});if(u.orcamento[id]){u.orcamento[nm]=u.orcamento[id];delete u.orcamento[id]}}else(u.categories=u.categories||[]).push(nm);
  }else if(kind==='orc'){
    const o={};[...CATS,...(u.categories||[])].forEach(k=>{const v=n('lim_'+k);if(v>0)o[k]=v});u.orcamento=o;
  }else if(kind==='perfil'){
    const em=g('email').toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return toast('E-mail inválido');
    if(users().some(x=>x.id!==u.id&&x.email.toLowerCase()===em))return toast('E-mail já usado em outra conta');
    Object.assign(u,{nomeCompleto:g('nomeCompleto')||u.nomeCompleto,nomePreferencia:g('nomePreferencia'),email:em,telefone:g('telefone'),moeda:g('moeda'),primeiroDiaMes:n('primeiroDiaMes')});
  }
  if(!save(u))return toast('Não foi possível salvar (armazenamento cheio ou bloqueado)');
  S.form=null;toast('Salvo ✓');render();
}
function deleteItem(u){
  const{kind,id}=S.form;
  if(kind==='acc'&&((u.transactions||[]).some(t=>t.contaId===id||t.contaOrigemId===id||t.contaDestinoId===id)||(u.accounts||[]).length<2))return alert('Esta conta tem lançamentos ou é a única conta. Não dá para excluir.');
  if(!confirm('Excluir este item?'))return;
  if(kind==='cat'){u.categories=u.categories.filter(x=>x!==id);delete u.orcamento[id]}
  else u[LISTS[kind]]=u[LISTS[kind]].filter(x=>x.id!==id);
  save(u);S.form=null;toast('Excluído');render();
}
function confirmEv(u,src,key,orig,pay){
  if(src==='tx'){const x=u.transactions.find(t=>t.id===key);if(x&&pay)x.status='pago';return}
  const r=(u[src]||[]).find(x=>x.id===key);if(!r)return;
  (r.confirmados=r.confirmados||[]).push(orig);
  if(pay){const rr=rules(u).find(x=>x.key===key);if(rr)u.transactions.push({id:'tx_'+uid(),tipo:rr.tipo,descricao:rr.nome,valor:rr.valor,data:orig,contaId:rr.contaId||(u.accounts[0]||{}).id,categoria:rr.cat,status:'pago',criadoEm:new Date().toISOString()})}
}
async function exportBackup(u){
  const data=JSON.stringify(u,null,2),name=`rumo-backup-${today()}.json`;
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:name,data});return}}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
}

/* ---------- eventos ---------- */
root.addEventListener('click',async e=>{
  const el=e.target.closest('[data-tab],[data-new],[data-edit],[data-action],[data-authmode],[data-txf],[data-hor]');if(!el)return;
  const d=el.dataset,u=getUser();
  if(d.authmode){S.authMode=d.authmode;S.err='';S.forgot=false;return render()}
  if(d.txf){S.txf=d.txf;return render()}
  if(d.hor){S.hor=+d.hor;if(!d.tab)return render()}
  if(d.tab){S.tab=d.tab;S.form=null;scrollTo(0,0);return render()}
  if(d.new){S.form={kind:d.new,id:null};scrollTo(0,0);return render()}
  if(d.edit){const[k,...r]=d.edit.split(':');S.form={kind:k,id:r.join(':')};scrollTo(0,0);return render()}
  const a=d.action;
  if(a==='forgot'){S.forgot=true;return render()}
  if(a==='back-login'){S.forgot=false;return render()}
  if(a==='logout'){try{localStorage.removeItem(LS_S)}catch(x){}S.tab='dashboard';S.form=null;return render()}
  if(!u)return;
  if(a==='cancel'){S.form=null;return render()}
  if(a==='delete')return deleteItem(u);
  if(a==='dup'){const x=u.transactions.find(t=>t.id===S.form.id);if(x){u.transactions.push({...x,id:'tx_'+uid(),data:today(),criadoEm:new Date().toISOString()});save(u);S.form=null;toast('Duplicado');render()}return}
  if(a==='confirm'||a==='skip'){confirmEv(u,d.src,d.key,d.orig,a==='confirm');save(u);toast(a==='confirm'?'Confirmado ✓':'Ignorado');return render()}
  if(a==='confirm-all'){events(u,0).forEach(x=>confirmEv(u,x.src,x.key,x.orig,true));save(u);toast('Tudo confirmado ✓');return render()}
  if(a==='export')return exportBackup(u);
});
root.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='form-login')return login(f);
  if(f.id==='form-cad')return signup(f);
  const u=getUser();if(u&&f.id==='f')saveForm(u,f);
});
root.addEventListener('input',e=>{
  if(e.target.name==='telefone')e.target.value=phone(e.target.value);
  const f=e.target.closest('#f');if(f)formSync(f);
});
root.addEventListener('change',e=>{
  const f=e.target.closest('#f');if(f)formSync(f);
  if(e.target.id==='imp'){
    const file=e.target.files[0],u=getUser();if(!file||!u)return;
    const r=new FileReader();
    r.onload=()=>{try{const i=JSON.parse(r.result);if(!i||!i.email||!i.accounts)throw 0;i.id=u.id;i.schema=i.schema||0;save(migrate(i));toast('Backup restaurado ✓')}catch(x){toast('Arquivo de backup inválido')}render()};
    r.readAsText(file);
  }
});
render();
})();
</script>
